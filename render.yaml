# Render Blueprint - Deploy eBay Card Listing Tool
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ebay-card-listing-tool
    runtime: python
    # Build
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1
    # Environment (set these in Render Dashboard → Environment)
    # Required: EBAY_APP_ID, EBAY_DEV_ID, EBAY_CERT_ID, EBAY_PRODUCTION_TOKEN, etc.
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
  - type: cron
    name: ebay-card-listing-keepalive
    runtime: python
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import os,urllib.request; u=os.environ.get('RENDER_EXTERNAL_URL','').rstrip('/')+'/health'; urllib.request.urlopen(u,timeout=20) if u.startswith('http') else None"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
